<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rajiv System | Live </title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap');
        
        :root { 
            --neon-blue: #00f2ff; 
        }

        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            background: #000; 
            color: white; 
            font-family: 'Inter', sans-serif; 
            overflow: hidden; 
        }
        
        /* 1. THE VIDEO BACKGROUND (FULL SCREEN) */
        #bg-video {
            position: fixed; 
            top: 50%; 
            left: 50%; 
            min-width: 100%; 
            min-height: 100%;
            width: auto; 
            height: auto; 
            z-index: -5; 
            transform: translate(-50%, -50%);
            object-fit: cover; 
            filter: brightness(0.4); /* Adjust this to make text more/less visible */
        }

        /* 2. VIGNETTE OVERLAY (SHADOW ON EDGES) */
        .overlay { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: radial-gradient(circle, transparent 20%, #000 130%); 
            z-index: -4; 
        }

        /* 3. MAIN CONTENT CONTAINER */
        .container { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100dvh; 
            z-index: 10; 
            position: relative; 
            text-align: center;
        }

        .label { 
            font-size: clamp(0.8rem, 2.5vw, 1.2rem); 
            text-transform: uppercase; 
            letter-spacing: 0.8rem; 
            color: rgba(255,255,255,0.5); 
            margin-bottom: 10px;
        }

        .networth-value { 
            font-size: clamp(4rem, 18vw, 11rem); 
            font-weight: 900; 
            margin: 0; 
            background: linear-gradient(180deg, #fff 40%, #777 100%); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            filter: drop-shadow(0 0 50px rgba(0, 242, 255, 0.4)); 
            line-height: 1; 
        }
        
        /* 4. SYSTEM FOOTER */
        .footer-bar { 
            margin-top: 50px; 
            width: clamp(280px, 85vw, 550px); 
            background: rgba(255,255,255,0.05); 
            backdrop-filter: blur(15px); 
            -webkit-backdrop-filter: blur(15px); 
            border: 1px solid rgba(255,255,255,0.1); 
            padding: 15px; 
            border-radius: 100px; 
            display: flex; 
            justify-content: space-around; 
            font-size: clamp(0.65rem, 2vw, 0.8rem); 
            text-transform: uppercase; 
            letter-spacing: 2px;
        }

        .status-dot { 
            width: 8px; 
            height: 8px; 
            background: var(--neon-blue); 
            border-radius: 50%; 
            display: inline-block; 
            box-shadow: 0 0 12px var(--neon-blue); 
            animation: pulse 2s infinite; 
            margin-right: 5px;
        }

        @keyframes pulse { 
            0%, 100% { opacity: 1; } 
            50% { opacity: 0.3; } 
        }
    </style>
</head>
<body>

    <video autoplay loop muted plays-inline id="bg-video">
        <source src="D:\Desktop\RAJ 26\CODE/spidermanedit.mp4" type="video/mp4">
    </video>

    <div class="overlay"></div>

    <div class="container">
        <div class="label">Total Net Worth</div>
        <h1 class="networth-value">$8</h1>
        
        <div class="footer-bar">
            <span><span class="status-dot"></span> System: Active</span>
            <span>Rank: DEVLOPER</span>
            <span>User: Rajiv Singh</span>
        </div>
    </div>

</body>
</html>
